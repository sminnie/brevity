[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brevity"
dynamic = ["version"]
description = "Domain shorthand for lower LLM token costs and measured answer quality."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Minnie Sankhe" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
brevity = "brevity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "brevity.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]